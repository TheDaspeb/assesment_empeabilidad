services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rw_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bd_daniel_perez_thomson
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - rw_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_daniel_perez_thomson"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rw_postgres_data: